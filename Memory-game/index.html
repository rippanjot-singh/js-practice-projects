<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main class="w-screen h-screen overflow-hidden">
        <nav class="w-screen h-20 bg-neutral-800 flex justify-between items-center px-8">
            <div class="logo font-bold text-2xl text-white">
                Memory Game
            </div>
            <div class="hearts">
                <i class="ri-poker-hearts-fill text-red-500 heart text-2xl"></i>
                <i class="ri-poker-hearts-fill text-red-500 heart text-2xl"></i>
                <i class="ri-poker-hearts-fill text-red-500 heart text-2xl"></i>
            </div>
            <div class="score font-bold text-2xl text-white">
                <p>250</p>
            </div>
        </nav>
        <section class="w-screen h-full bg-neutral-700 flex items-center justify-center">
            <div class="board grid grid-cols-6 grid-rows-6 gap-2 w-[60vw] h-[60vw] xl:w-[40vw] xl:h-[40vw] "></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
