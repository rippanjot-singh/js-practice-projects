<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Pallet Maker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="top">
            <h1>Color Pallet Maker</h1>
        </div>
        <div class="bottom">
            <div class="pallet">
                <div class="color first"></div>
                <div class="color second"></div>
                <div class="color third"></div>
                <div class="color fourth"></div>
                <div class="color fifth"></div>
            </div>
            <div class="buttons">
                <button id="generate">Generate New Pallet</button>
                <button id="copy">Copy Colors</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
